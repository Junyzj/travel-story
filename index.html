<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Travel Story</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="container">

    <h1>Travel Story</h1>

    <p class="intro">
      The same three images can tell two different stories.
      Choose a sequence to see how the meaning changes.
    </p>

    <h2 id="story-title">Going on a Trip</h2>

    <div class="image-container">

      <div class="image-box">
        <p>Beginning</p>

        <img
          id="image1"
          src="images/image1.jpg"
          alt="home"
        />
      </div>

      <div class="image-box">
        <p>Middle</p>

        <img
          id="image2"
          src="images/image2.jpg"
          alt="suitcase"
        />
      </div>

      <div class="image-box">
        <p>End</p>

        <img
          id="image3"
          src="images/image3.jpg"
          alt="airport"
        />
      </div>

    </div>

    <p id="story-text">
      I leave home, pack my suitcase, and arrive at the airport to begin my trip.
    </p>

    <div class="buttons">

      <button id="sequence-one">
        Going on a Trip
      </button>

      <button id="sequence-two">
        Going Home
      </button>

    </div>

  </main>

  <script src="script.js"></script>

</body>

</html>
